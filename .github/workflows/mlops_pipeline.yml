name: Deploy Multi-Container App to EC2

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: churn-api
  ECR_FRONT_REPO: churn-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # --- TRAIN MODEL BEFORE BUILDING API ---
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install Training Dependencies
      run: pip install pandas openpyxl scikit-learn catboost mlflow

    - name: Train Model
      run: |
        cd ml
        python train.py
        mv final_model.cbm ../api/

    # --- BUILD & PUSH API ---
    - name: Build & Push API Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG ./api
        docker push $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG

    # --- BUILD & PUSH FRONTEND ---
    - name: Build & Push Frontend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_FRONT_REPO:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/$ECR_FRONT_REPO:$IMAGE_TAG

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Create app directory (safe even if exists)
    - name: Create App Directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: mkdir -p /home/ubuntu/churn-app

    # Upload only the compose file
    - name: Upload Compose File
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.prod.yaml"
        target: "/home/ubuntu/churn-app/"

    # Main deployment logic
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e

          echo "=== Logging into ECR on EC2 ==="
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

          cd /home/ubuntu/churn-app

          echo "=== Writing .env for Docker Compose ==="
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" > .env
          echo "AWS_REGION=us-east-1" >> .env

          echo "=== Pulling latest images ==="
          docker compose -f docker-compose.prod.yaml pull || true

          echo "=== Attempting clean shutdown ==="
          docker compose -f docker-compose.prod.yaml down || true

          echo "=== Restarting Docker service in case containers were stuck ==="
          sudo systemctl restart docker

          echo "=== Starting fresh containers ==="
          docker compose -f docker-compose.prod.yaml up -d --remove-orphans

          echo "=== Cleaning old images ==="
          docker image prune -f

          echo "=== Deployment Complete ==="
