name: Deploy Multi-Container App to EC2

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_API_REPO: churn-api
  ECR_FRONT_REPO: churn-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # --- TRAIN MODEL ---
    # This generates the model file freshly on every push
    - name: Set up Python for Training
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install Training Dependencies
      # Added 'openpyxl' just in case you switch back to Excel
      run: pip install pandas openpyxl scikit-learn catboost mlflow

    - name: Train Model
      run: |
        cd ml
        python train.py
        # Move the generated model to the API folder so Docker can find it
        mv final_model.cbm ../api/

    # --- BUILD & PUSH API ---
    - name: Build and Push API
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        # Docker build finds the model because we moved it into ./api above
        docker build -t $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG ./api
        docker push $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG

    # --- BUILD & PUSH FRONTEND ---
    - name: Build and Push Frontend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_FRONT_REPO:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/$ECR_FRONT_REPO:$IMAGE_TAG

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # 1. Create directory on EC2 first to avoid SCP errors
    - name: Create App Directory
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: mkdir -p /home/ubuntu/churn-app

    # 2. Copy ONLY the compose file (Data is already inside the Docker images)
    - name: Copy Compose File to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.prod.yaml"
        target: "/home/ubuntu/churn-app/"

    # 3. Deploy via SSH
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Login to AWS ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
          
          # Navigate to app folder
          cd /home/ubuntu/churn-app
          
          # Create .env file for Docker Compose
          # This persists the variables so you can restart manually later if needed
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" > .env
          echo "AWS_REGION=us-east-1" >> .env
          
          # Pull latest images and restart
          docker-compose -f docker-compose.prod.yaml pull
          docker-compose -f docker-compose.prod.yaml down
          docker-compose -f docker-compose.prod.yaml up -d --remove-orphans
          
          # Cleanup unused images to save disk space
          docker image prune -f